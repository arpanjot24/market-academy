# Builds and publishes the app to GitHub Pages (free for public repositories).
# Runs on every push, and every 3 hours to refresh news headlines.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Refresh news headlines
        run: node scripts/fetch-news.mjs || echo "News fetch failed; using the committed copy"
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
